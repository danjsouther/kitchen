services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Bound to loopback only — the database is never exposed to the network.
      # Host port is configurable so this can coexist with another local Postgres.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # These override the values env_file pulls from .env, which carry local-dev
      # defaults chosen to dodge port clashes on the host. Inside the container
      # there is nothing to clash with, and 3000 is what nginx proxies to.
      PORT: 3000
      # The app and the API share an origin behind nginx, so this is only ever
      # used by the CORS allowlist for a direct, non-proxied call.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    # So ConfigModule / prisma resolve the same root .env as local dev
    # (env_file injects vars; the mount makes the file visible at /repo/.env).
    volumes:
      - .env:/repo/.env:ro
      - recipe-images:/repo/packages/backend/uploads
    expose:
      - "3000"

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Host port is configurable so multiple deployments on the same host
      # (e.g. behind nginx vhosts for different domains) don't clash.
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

volumes:
  postgres-data:
  recipe-images:
