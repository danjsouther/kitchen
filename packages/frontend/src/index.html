    <meta name="theme-color" content="#795548" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!--
      Fonts come from Google. The app is otherwise entirely self-hosted, so if
      you run it somewhere without outbound internet the icons will render as
      their names and the type will fall back to a system sans — everything
      still works, it just looks plainer.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  </head>

  </body>
</html>
