server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded recipe images and any other large POST bodies.
    client_max_body_size 12m;

    # Mirrors packages/frontend/proxy.conf.json used in local dev.
    #
    # Note there is deliberately NO rewrite stripping /api here. The NestJS app
    # calls app.setGlobalPrefix('api'), so the backend genuinely serves /api/*
    # and expects to receive it. proxy_pass without a URI path preserves the
    # original request path — adding a trailing slash or a rewrite would strip
    # the prefix and turn every API call into a 404.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serving the API through the same origin as the app is what keeps the
    # session cookie first-party: no CORS, and no SameSite=None needed.

    # index.html must never be cached immutably or a deploy would not be picked
    # up: it is the file that names the current hashed bundles.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Hashed build output — safe to cache hard.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Angular SPA routing fallback: a deep link like /recipes/12 is not a file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
